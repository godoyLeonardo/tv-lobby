<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0d0e12">
<title>TV Lobby</title>
<style>
  :root {
    --bg: #0d0e12;
    --surface: #1b1d24;
    --text: #f2f3f5;
    --muted: #8a8f98;
    --on: #3ddc84;
    --standby: #ffb020;
    --danger: #e5484d;
    --radius: 16px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: max(16px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
    background: radial-gradient(120% 60% at 10% 0%, #1e2a4a 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--text);
    font: 16px/1.35 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  header { display: flex; align-items: baseline; justify-content: space-between; margin: 4px 2px 18px; }
  h1 { margin: 0; font-size: 24px; font-weight: 700; }
  #status { color: var(--muted); font-size: 13px; }
  h2 { margin: 22px 2px 10px; font-size: 12px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  button {
    appearance: none; border: 0; border-radius: var(--radius); padding: 16px; min-height: 76px;
    color: var(--text); background: var(--surface); text-align: left; font: inherit; cursor: pointer;
    transition: transform .08s ease, filter .15s ease;
  }
  button:active { transform: scale(.97); filter: brightness(1.15); }
  button:disabled { opacity: .5; }
  .name { display: block; font-weight: 700; font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail { display: block; margin-top: 3px; font-size: 13px; color: rgba(255,255,255,.8); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dot::before { content: "● "; }
  .dot.on::before { color: var(--on); }
  .dot.standby::before { color: var(--standby); }
  .output.active { outline: 2px solid var(--on); outline-offset: -2px; }
  .output .art { float: right; width: 44px; height: 44px; margin: -4px -4px 0 8px; border-radius: 8px; object-fit: cover; }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row #health { grid-column: span 2; min-height: 60px; }
  .danger { background: color-mix(in srgb, var(--danger) 22%, var(--surface)); }
  button { position: relative; -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; touch-action: manipulation; }
  .more { position: absolute; top: 8px; right: 12px; font-size: 14px; letter-spacing: 1px; color: rgba(255,255,255,.55); }
  .hint { margin: 18px 2px 0; color: var(--muted); font-size: 12px; }

  #sheet { position: fixed; inset: 0; display: flex; align-items: flex-end; background: rgba(0,0,0,.55); z-index: 10; }
  #sheet[hidden] { display: none; }
  .sheet-card {
    width: 100%; max-height: 85vh; overflow-y: auto; background: #161922;
    border-radius: 22px 22px 0 0; padding: 18px 16px max(16px, env(safe-area-inset-bottom));
    animation: rise .18s ease-out;
  }
  @keyframes rise { from { transform: translateY(24px); opacity: 0; } }
  .sheet-card h3 { margin: 4px 2px 6px; font-size: 20px; }
  .sheet-card button { min-height: 56px; padding: 12px 14px; }
  .sheet-card .current { outline: 2px solid var(--on); outline-offset: -2px; }
  #sheet-close { width: 100%; margin-top: 16px; text-align: center; min-height: 52px; }
  .status-row { display: flex; gap: 12px; align-items: flex-start; padding: 10px 2px; }
  .status-row .mark { width: 20px; text-align: center; }
  .status-row .ok { color: var(--on); }
  .status-row .bad { color: var(--danger); }

  .tabs { display: inline-flex; background: var(--surface); border-radius: 999px; padding: 3px; margin: 0 0 6px 2px; }
  .tabs button { min-height: 0; padding: 7px 16px; border-radius: 999px; background: none; color: var(--muted); font-weight: 600; text-align: center; }
  .tabs button[aria-selected="true"] { background: #2a2e38; color: var(--text); }

  #remote-view { max-width: 360px; margin: 8px auto 0; }
  .remote-top { display: flex; justify-content: space-between; margin-bottom: 18px; }
  .round { width: 56px; height: 56px; min-height: 0; padding: 0; border-radius: 50%; display: grid; place-items: center; }
  .round svg, .key svg { width: 26px; height: 26px; fill: currentColor; }
  .power { color: var(--danger); }
  .clickpad { position: relative; width: 260px; height: 260px; margin: 0 auto 22px; border-radius: 50%; background: var(--surface); box-shadow: inset 0 0 0 1px rgba(255,255,255,.06); }
  .clickpad button { position: absolute; min-height: 0; padding: 0; background: none; display: grid; place-items: center; color: var(--muted); }
  .clickpad button:active { color: var(--text); background: rgba(255,255,255,.06); transform: none; }
  .clickpad .up { left: 80px; top: 0; width: 100px; height: 80px; border-radius: 50% 50% 0 0; }
  .clickpad .down { left: 80px; bottom: 0; width: 100px; height: 80px; border-radius: 0 0 50% 50%; }
  .clickpad .left { left: 0; top: 80px; width: 80px; height: 100px; border-radius: 50% 0 0 50%; }
  .clickpad .right { right: 0; top: 80px; width: 80px; height: 100px; border-radius: 0 50% 50% 0; }
  .clickpad .ok { left: 80px; top: 80px; width: 100px; height: 100px; border-radius: 50%; background: #2a2e38; color: var(--text); font-weight: 700; }
  .keys { display: grid; grid-template-columns: 1fr 1fr 72px; gap: 14px 18px; align-items: center; justify-items: center; }
  .key { width: 64px; height: 64px; min-height: 0; padding: 0; border-radius: 50%; display: grid; place-items: center; }
  .rocker { grid-column: 3; grid-row: 1 / span 2; width: 64px; height: 142px; min-height: 0; padding: 0; border-radius: 32px; background: var(--surface); display: grid; grid-template-rows: 1fr 1fr; overflow: hidden; }
  .rocker button { min-height: 0; border-radius: 0; background: none; font-size: 28px; font-weight: 300; text-align: center; padding: 0; }
  .keyboard { display: flex; gap: 8px; margin-top: 22px; }
  .keyboard[hidden] { display: none; }
  .keyboard input { flex: 1; min-width: 0; border: 0; border-radius: 14px; padding: 14px; background: var(--surface); color: var(--text); font: inherit; }
  .keyboard button { min-height: 0; padding: 0 14px; border-radius: 14px; text-align: center; }
</style>
</head>
<body>
<header><h1>TV Lobby</h1><span id="status">Connecting…</span></header>
<div class="tabs" role="tablist">
  <button role="tab" id="tab-lobby" aria-selected="true">Lobby</button>
  <button role="tab" id="tab-remote" aria-selected="false">Remote</button>
</div>

<main id="lobby-view">

<h2>Inputs</h2>
<div class="grid" id="inputs"></div>

<h2>Sound</h2>
<div class="grid" id="outputs"></div>

<h2>TV</h2>
<div class="row">
  <button id="lobby"><span class="name">Lobby</span><span class="detail">Back to the home screen</span></button>
  <button id="goodnight" class="danger"><span class="name">Goodnight</span><span class="detail">Everything off</span></button>
  <button id="health"><span class="name">Status</span><span class="detail">Check every part</span></button>
</div>

<p class="hint">Hold a card with ••• for more.</p>
</main>

<section id="remote-view" hidden aria-label="Remote">
  <div class="remote-top">
    <button class="round power" data-key="power" aria-label="Power"><svg viewBox="0 0 24 24"><path d="M12 3a1 1 0 0 0-1 1v8a1 1 0 0 0 2 0V4a1 1 0 0 0-1-1zm5.14 2.86a1 1 0 0 0-1.42 1.42A7 7 0 1 1 6.3 7.28a1 1 0 0 0-1.42-1.42 9 9 0 1 0 12.26 0z"/></svg></button>
    <button class="round" id="keyboard-toggle" aria-label="Keyboard"><svg viewBox="0 0 24 24"><path d="M20 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm-9 3h2v2h-2V8zm0 3h2v2h-2v-2zM8 8h2v2H8V8zm0 3h2v2H8v-2zM5 8h2v2H5V8zm0 3h2v2H5v-2zm11 5H8v-2h8v2zm0-3h-2v-2h2v2zm0-3h-2V8h2v2zm3 3h-2v-2h2v2zm0-3h-2V8h2v2z"/></svg></button>
  </div>

  <div class="clickpad">
    <button class="up" data-key="up" data-repeat aria-label="Up"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M7.4 15.4 12 10.8l4.6 4.6L18 14l-6-6-6 6z"/></svg></button>
    <button class="left" data-key="left" data-repeat aria-label="Left"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M15.4 16.6 10.8 12l4.6-4.6L14 6l-6 6 6 6z"/></svg></button>
    <button class="ok" data-key="ok" aria-label="OK">OK</button>
    <button class="right" data-key="right" data-repeat aria-label="Right"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M8.6 16.6 13.2 12 8.6 7.4 10 6l6 6-6 6z"/></svg></button>
    <button class="down" data-key="down" data-repeat aria-label="Down"><svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M7.4 8.6 12 13.2l4.6-4.6L18 10l-6 6-6-6z"/></svg></button>
  </div>

  <div class="keys">
    <button class="key" data-key="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15.4 16.6 10.8 12l4.6-4.6L14 6l-6 6 6 6z"/></svg></button>
    <button class="key" data-key="home" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M21 3H3a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h5v2h8v-2h5a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2zm0 14H3V5h18v12z"/></svg></button>
    <div class="rocker">
      <button data-key="volume-up" data-repeat aria-label="Volume up">+</button>
      <button data-key="volume-down" data-repeat aria-label="Volume down">−</button>
    </div>
    <button class="key" data-key="play-pause" aria-label="Play or pause"><svg viewBox="0 0 24 24"><path d="M3 5v14l9-7zm10 0h3v14h-3zm5 0h3v14h-3z"/></svg></button>
    <button class="key" data-key="mute" aria-label="Mute"><svg viewBox="0 0 24 24"><path d="M16.5 12A4.5 4.5 0 0 0 14 8v2.18l2.45 2.45c.03-.2.05-.41.05-.63zM19 12c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3 3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a9 9 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4 9.91 6.09 12 8.18V4z"/></svg></button>
  </div>

  <form class="keyboard" id="keyboard" hidden autocomplete="off">
    <input id="keyboard-text" placeholder="Type on the TV" enterkeyhint="send" autocapitalize="off" autocorrect="off" spellcheck="false">
    <button type="button" data-key="delete" aria-label="Delete">⌫</button>
    <button type="submit">Send</button>
  </form>
</section>

<div id="sheet" hidden>
  <div class="sheet-card" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <h3 id="sheet-title"></h3>
    <div id="sheet-body"></div>
    <button id="sheet-close">Close</button>
  </div>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  const status = $("status");

  let state = null;

  async function post(path) {
    status.textContent = "Sending…";
    try {
      const response = await fetch(path, { method: "POST" });
      const result = await response.json().catch(() => ({}));
      status.textContent = result.ok === false ? "Not accepted" : "Sent";
      setTimeout(refresh, 1500);
    } catch {
      status.textContent = "TV not reachable";
    }
  }

  // Tap runs onTap; holding half a second runs onHold instead (and the tap is dropped).
  function pressable(button, onTap, onHold) {
    let timer = 0;
    let held = false;
    button.addEventListener("pointerdown", () => {
      held = false;
      timer = setTimeout(() => {
        held = true;
        navigator.vibrate?.(12);
        onHold();
      }, 500);
    });
    for (const type of ["pointerup", "pointerleave", "pointercancel"]) button.addEventListener(type, () => clearTimeout(timer));
    button.addEventListener("contextmenu", (event) => event.preventDefault());
    button.addEventListener("click", () => held ? (held = false) : onTap());
    button.append(el("span", { className: "more", textContent: "•••", ariaHidden: "true" }));
  }

  // rows: [{ label, options: [{ label, detail, current, danger, action }] }]
  function openSheet(title, rows) {
    $("sheet-title").textContent = title;
    $("sheet-body").replaceChildren(...rows.filter((row) => row.options.length).map((row) => [
      row.label ? el("h2", { textContent: row.label }) : "",
      el("div", { className: "grid" }, row.options.map((option) => el("button", {
        className: [option.current && "current", option.danger && "danger"].filter(Boolean).join(" "),
        onclick: () => { closeSheet(); option.action(); },
      }, [
        el("span", { className: "name", textContent: option.label }),
        option.detail ? el("span", { className: "detail", textContent: option.detail }) : "",
      ]))),
    ]).flat());
    $("sheet").hidden = false;
  }

  function closeSheet() {
    $("sheet").hidden = true;
  }

  function inputSheet(input) {
    openSheet(input.label, [{ options: [
      { label: "Open", detail: "Switch and wake", action: () => post(`/api/input/${input.port}`) },
      { label: "Turn off", detail: "HDMI standby", danger: true, action: () => post(`/api/input/${input.port}/off`) },
    ] }]);
  }

  async function wiimSheet(output) {
    const wiim = state?.wiim;
    status.textContent = "Loading…";
    const inputs = await fetch("/api/wiim/inputs").then((r) => r.json()).catch(() => []);
    status.textContent = "";
    const modes = { HDMI: [49], phono: [54], bluetooth: [41], "line-in": [40], optical: [43] };
    const isCurrent = (command) => wiim && (command === "wifi" ? wiim.ownSource && !Object.values(modes).flat().includes(wiim.mode) : (modes[command] || []).includes(wiim.mode));
    openSheet(output.label, [
      { label: "Now playing", options: wiim?.ownSource ? [
        { label: "Previous", action: () => post("/api/wiim/previous") },
        { label: wiim.playing ? "Pause" : "Play", action: () => post("/api/wiim/toggle") },
        { label: "Next", action: () => post("/api/wiim/next") },
      ] : [] },
      { label: "Input", options: inputs.map((input) => ({ label: input.label, current: isCurrent(input.command), action: () => post(`/api/wiim/input/${input.command}`) })) },
      { label: "Volume", options: [
        ...(wiim?.presets || []).map((preset) => ({ label: `${preset.label} · ${preset.volume}`, current: wiim.volume === preset.volume, action: () => post(`/api/wiim/volume/${preset.volume}`) })),
        { label: wiim?.muted ? "Unmute" : "Mute", action: () => post(`/api/wiim/mute/${wiim?.muted ? 0 : 1}`) },
      ] },
      { label: "Device", options: [
        { label: "Reset Spotify", detail: "When Spotify stops listing the WiiM", action: () => confirm("Reset Spotify Connect on the WiiM? Spotify will sign in again.") && post("/api/wiim/spotify-reset") },
        { label: "Restart WiiM", detail: "When its screen or knob stop responding", danger: true, action: () => confirm("Restart the WiiM?") && post("/api/wiim/restart") },
      ] },
    ]);
  }

  async function healthSheet() {
    $("sheet-title").textContent = "Status";
    $("sheet-body").replaceChildren(el("p", { className: "hint", textContent: "Checking…" }));
    $("sheet").hidden = false;
    const checks = await fetch("/api/health").then((r) => r.json()).catch(() => [{ name: "TV", ok: false, detail: "Not reachable" }]);
    $("sheet-body").replaceChildren(...checks.map((check) => el("div", { className: "status-row" }, [
      el("span", { className: `mark ${check.ok ? "ok" : "bad"}`, textContent: check.ok ? "✓" : "✕" }),
      el("div", {}, [el("span", { className: "name", textContent: check.name }), el("span", { className: "detail", textContent: check.detail })]),
    ])));
  }

  function el(tag, props = {}, children = []) {
    const node = Object.assign(document.createElement(tag), props);
    node.append(...children);
    return node;
  }

  function render(state) {
    $("inputs").replaceChildren(...state.inputs.map((input) => {
      const button = el("button", {}, [
        el("span", { className: "name", textContent: input.label }),
        el("span", { className: `detail dot ${input.power}`, textContent: input.power[0].toUpperCase() + input.power.slice(1) }),
      ]);
      button.style.background = `linear-gradient(135deg, ${input.colors.join(", ")})`;
      pressable(button, () => post(`/api/input/${input.port}`), () => inputSheet(input));
      return button;
    }));

    const wiim = state.wiim;
    $("outputs").replaceChildren(...state.outputs.map((output) => {
      let detail = output.detail;
      const isWiim = output.label.startsWith("WiiM") && wiim;
      if (isWiim && !wiim.onTv && wiim.title) detail = [wiim.title, wiim.artist].filter(Boolean).join(" — ");
      else if (isWiim && output.active) detail = wiim.muted ? "Muted" : `Vol ${wiim.volume}`;
      const children = [
        el("span", { className: "name", textContent: output.label }),
        el("span", { className: `detail ${output.active ? "dot on" : ""}`, textContent: detail }),
      ];
      if (isWiim && wiim.art) children.unshift(el("img", { className: "art", src: wiim.art, alt: "" }));
      const button = el("button", { className: `output ${output.active ? "active" : ""}` }, children);
      if (isWiim) pressable(button, () => post(`/api/output/${output.type}`), () => wiimSheet(output));
      else button.onclick = () => post(`/api/output/${output.type}`);
      return button;
    }));
  }

  async function refresh() {
    try {
      const response = await fetch("/api/state");
      state = await response.json();
      render(state);
      status.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    } catch {
      status.textContent = "TV not reachable";
    }
  }

  $("lobby").onclick = () => post("/api/lobby");
  $("goodnight").onclick = () => confirm("Turn the TV and every device off?") && post("/api/goodnight");
  $("health").onclick = healthSheet;
  $("sheet-close").onclick = closeSheet;
  $("sheet").onclick = (event) => event.target === $("sheet") && closeSheet();

  // Remote: a press sends once; holding an arrow or the volume keeps sending, like a real remote.
  function sendKey(key) {
    navigator.vibrate?.(5);
    fetch(`/api/key/${key}`, { method: "POST" }).catch(() => (status.textContent = "TV not reachable"));
  }

  for (const button of document.querySelectorAll("[data-key]")) {
    const key = button.dataset.key;
    if (!("repeat" in button.dataset)) {
      button.addEventListener("click", () => sendKey(key));
      continue;
    }
    let delay = 0;
    let interval = 0;
    const stop = () => { clearTimeout(delay); clearInterval(interval); };
    button.addEventListener("pointerdown", (event) => {
      event.preventDefault();
      sendKey(key);
      delay = setTimeout(() => (interval = setInterval(() => sendKey(key), 120)), 400);
    });
    for (const type of ["pointerup", "pointerleave", "pointercancel"]) button.addEventListener(type, stop);
    button.addEventListener("contextmenu", (event) => event.preventDefault());
  }

  $("keyboard-toggle").onclick = () => {
    $("keyboard").hidden = !$("keyboard").hidden;
    if (!$("keyboard").hidden) $("keyboard-text").focus();
  };
  $("keyboard").onsubmit = (event) => {
    event.preventDefault();
    const text = $("keyboard-text").value;
    if (!text) return;
    fetch(`/api/text?value=${encodeURIComponent(text)}`, { method: "POST" });
    $("keyboard-text").value = "";
  };

  function showTab(name) {
    const remote = name === "remote";
    $("lobby-view").hidden = remote;
    $("remote-view").hidden = !remote;
    $("tab-lobby").setAttribute("aria-selected", String(!remote));
    $("tab-remote").setAttribute("aria-selected", String(remote));
    try { localStorage.setItem("tab", name); } catch {}
  }
  $("tab-lobby").onclick = () => showTab("lobby");
  $("tab-remote").onclick = () => showTab("remote");
  try { if (localStorage.getItem("tab") === "remote") showTab("remote"); } catch {}

  refresh();
  setInterval(refresh, 5000);
  document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && refresh());
</script>
</body>
</html>
